<div class="modal-overlay" (click)="cancelar.emit()">
  <div class="modal-card confirm-mini" (click)="$event.stopPropagation()">
    
    <div class="modal-head" *ngIf="tipo !== 'sucesso'">
      <h3 [style.color]="tipo === 'perigo' ? '#ff4444' : 'white'">{{ icone }} {{ titulo }}</h3>
      <button class="btn-close" (click)="cancelar.emit()">✕</button>
    </div>

    <div class="form-body" style="text-align: center; padding: 40px 30px 20px;">
      <div *ngIf="tipo === 'sucesso'" style="font-size: 3rem; margin-bottom: 15px;">{{ icone }}</div>
      <h3 *ngIf="tipo === 'sucesso'" style="color: #00c851; margin: 0 0 10px;">{{ titulo }}</h3>
      
      <ng-content></ng-content>
    </div>

    <div class="modal-footer" [style.justify-content]="tipo === 'sucesso' ? 'center' : 'flex-end'">
      <button 
        *ngIf="!esconderCancelar" 
        class="btn-cancelar" 
        (click)="cancelar.emit()">
        {{ textoCancelar }}
      </button>
      
      <button 
        class="btn-salvar" 
        [ngClass]="{'btn-perigo': tipo === 'perigo', 'btn-sucesso': tipo === 'sucesso'}" 
        [style.width]="tipo === 'sucesso' ? '100%' : 'auto'"
        (click)="confirmar.emit()">
        {{ textoConfirmar }}
      </button>
    </div>

  </div>
</div>
